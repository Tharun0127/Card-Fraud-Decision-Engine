# Pipeline configuration. Every value here is read by code; nothing is duplicated
# in source files.
seed: 20240917
n_threads: 8               # fixed thread count for LightGBM determinism

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  model_dir: artifacts/models
  outputs_dir: outputs

kaggle:
  competition: ieee-fraud-detection
  # source: competition = official competition API (requires accepting the rules);
  #         mirror      = public Kaggle dataset re-upload (see FINDINGS.md deviation).
  source: mirror
  mirror_dataset: lnasiri007/ieeecis-fraud-detection
  files: [train_transaction.csv, train_identity.csv]
  # Byte sizes published on the official competition file listing. Any download,
  # from either source, must match exactly or the pipeline stops.
  expected_bytes:
    train_transaction.csv: 683351067
    train_identity.csv: 26529680
  expected_rows: 590540

split:
  train_frac: 0.70
  valid_frac: 0.15          # test = remainder (0.15)

features:
  velocity_windows_seconds: {1h: 3600, 24h: 86400, 7d: 604800}
  te_columns: [ProductCD, addr1, P_emaildomain, R_emaildomain]
  te_smoothing: 50          # pseudo-count toward the global prior
  te_folds: 5
  v_corr_threshold: 0.90    # drop V columns more correlated than this with a kept one
  v_max_keep: 35
  v_sample_rows: 150000
  max_features: 150

model:
  cv_folds: 5
  tuning_grid:
    num_leaves: [63, 255]
    min_child_samples: [50, 200]
    feature_fraction: [0.5]
  fixed_params:
    learning_rate: 0.05
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    max_bin: 255
    cat_smooth: 10
    min_data_per_group: 100
  max_rounds: 3000
  early_stopping_rounds: 100

evaluation:
  n_bootstrap: 1000
  ci_level: 0.95
  precision_at: [0.01, 0.05]

rules_baseline:
  amount_percentile: 90     # pre-registered, not tuned

monitoring:
  psi_bins: 10
  psi_warn: 0.10
  psi_alert: 0.25
  score_window_days: 7
  plan:                          # production monitoring triggers (MONITORING_PLAN.md)
    psi_features_alert_count: 5  # investigate if this many features cross psi_alert in one window
    score_psi_retrain: 0.25      # retrain review if weekly score PSI vs the validation reference exceeds this
    pr_auc_relative_drop: 0.15   # retrain if matured-label PR-AUC falls by this share vs the launch baseline
    decline_rate_band: 0.5       # investigate if daily decline rate moves by this share vs the launch rate
    capacity_breach_days: 3      # consecutive days over review capacity before thresholds are re-selected
    label_maturity_days: 90      # wait before treating a window's labels as final
